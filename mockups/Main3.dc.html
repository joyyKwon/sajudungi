<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(96% 0.018 80);
      --bg-card: oklch(99% 0.01 80);
      --indigo-soft: oklch(90% 0.03 265);
      --ink: oklch(24% 0.025 265);
      --ink-soft: oklch(48% 0.02 265);
      --ink-faint: oklch(68% 0.015 80);
      --indigo: oklch(35% 0.09 265);
      --gold: oklch(74% 0.13 78);
      --gold-deep: oklch(52% 0.12 70);
      --line: oklch(90% 0.015 80);
      --white: oklch(99% 0.005 80);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .screen{
      width:390px; height:844px; background:var(--bg); overflow:hidden;
      font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);
      display:flex; flex-direction:column;
    }
    h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',serif; margin:0; font-weight:700;}
    .content{flex:1; overflow:auto; padding:6px 20px 20px; display:flex; flex-direction:column; gap:16px;}
    .card{background:var(--bg-card); border:1px solid var(--line); border-radius:18px; padding:16px;}
    .menu-row{display:flex; align-items:center; gap:14px; padding:14px 6px;}
    .menu-icon{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
    .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;}
    .tabbar{display:flex; border-top:1px solid var(--line); background:var(--white); padding:10px 8px 22px; justify-content:space-around;}
    .tab{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--ink-faint);}
    .tab.active{color:var(--indigo); font-weight:700;}
  </style>
</helmet>

<div class="screen">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:22px 20px 10px;">
    <div>
      <p style="font-size:13px; color:var(--ink-soft);">안녕하세요</p>
      <h2 style="font-size:20px; margin-top:2px;">서연님</h2>
    </div>
    <div style="display:flex; gap:14px;">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z" fill="none" stroke="#4a4f72" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="#4a4f72" stroke-width="1.7" stroke-linecap="round"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4" fill="none" stroke="#4a4f72" stroke-width="1.7"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="#4a4f72" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="content">
    <div class="card" style="background:var(--indigo-soft); border:none; display:flex; gap:12px; align-items:flex-start;">
      <img src="mascot_front.png" alt="사주둥이" style="width:52px; height:auto; flex-shrink:0;"/>
      <div>
        <p style="font-size:12px; color:var(--indigo); font-weight:700; margin-bottom:4px;">오늘의 한마디</p>
        <p style="font-size:13.5px; line-height:1.5;">오늘은 미뤄뒀던 연락을 해보기 좋은 날이야. 작은 인연이 큰 기쁨이 될 수 있어!</p>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h3 style="font-size:16px;">오늘의 운세</h3>
        <span style="font-size:12px; color:var(--gold-deep); font-weight:700;">자세히 보기 &gt;</span>
      </div>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.6;">전체운 ★★★★☆ · 재물운 ★★★☆☆<br/>대인관계에서 좋은 소식이 들려오는 하루예요.</p>
    </div>

    <div>
      <h3 style="font-size:15px; margin-bottom:6px; padding:0 6px;">무엇을 도와줄까요?</h3>

      <div class="menu-row" style="border-bottom:1px solid var(--line);">
        <div class="menu-icon" style="background:var(--indigo-soft);">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 0 4 23z" fill="none" stroke="#2b2f52" stroke-width="1.6"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 1 2.5 2z" fill="none" stroke="#2b2f52" stroke-width="1.6"/></svg>
        </div>
        <div style="flex:1;">
          <p style="font-size:14.5px; font-weight:700;">사주풀이</p>
          <p style="font-size:12px; color:var(--ink-soft);">내 사주팔자 기본 해석 보기</p>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="#b7bad0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="menu-row" style="border-bottom:1px solid var(--line);">
        <div class="menu-icon" style="background:var(--indigo-soft);">
          <svg width="22" height="22" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="#2b2f52" stroke-width="1.6"/><path d="M9 9h6M9 13h6M9 17h4" stroke="#2b2f52" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div style="flex:1;">
          <p style="font-size:14.5px; font-weight:700;">만세력</p>
          <p style="font-size:12px; color:var(--ink-soft);">원국표, 대운·세운 상세 보기</p>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="#b7bad0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="menu-row" style="border-bottom:1px solid var(--line);">
        <div class="menu-icon" style="background:oklch(90% 0.06 78);">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 0 4 23z" fill="none" stroke="#8a5a12" stroke-width="1.6"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 1 2.5 2z" fill="none" stroke="#8a5a12" stroke-width="1.6"/></svg>
        </div>
        <div style="flex:1; display:flex; align-items:center; gap:8px;">
          <div>
            <p style="font-size:14.5px; font-weight:700;">사주공부</p>
            <p style="font-size:12px; color:var(--ink-soft);">사주둥이와 기초부터 배워요</p>
          </div>
          <span class="badge" style="background:var(--gold); color:var(--ink);">NEW</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="#b7bad0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="menu-row" style="border-bottom:1px solid var(--line); opacity:.5;">
        <div class="menu-icon" style="background:oklch(93% 0.008 80);">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 21c2-3 6-3 8 0M9 13a3 3 0 1 1 6 0c0 2-3 3-3 5" stroke="#8a8fa8" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </div>
        <div style="flex:1;">
          <p style="font-size:14.5px; font-weight:700;">궁합</p>
          <p style="font-size:12px; color:var(--ink-soft);">우리 둘의 인연 알아보기</p>
        </div>
        <span class="badge" style="background:oklch(93% 0.008 80); color:var(--ink-soft);">준비중</span>
      </div>

      <div class="menu-row" style="opacity:.5;">
        <div class="menu-icon" style="background:oklch(93% 0.008 80);">
          <svg width="22" height="22" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="#8a8fa8" stroke-width="1.6"/><path d="M9 9h6M9 13h6" stroke="#8a8fa8" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div style="flex:1;">
          <p style="font-size:14.5px; font-weight:700;">토정비결</p>
          <p style="font-size:12px; color:var(--ink-soft);">2026년 신년운세</p>
        </div>
        <span class="badge" style="background:oklch(93% 0.008 80); color:var(--ink-soft);">준비중</span>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
      홈
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      만세력
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 0 4 23z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 1 2.5 2z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      학습
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      마이
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
