<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97% 0.02 75);
      --bg-card: oklch(99% 0.012 75);
      --amber-soft: oklch(93% 0.05 82);
      --ink: oklch(28% 0.05 40);
      --ink-soft: oklch(50% 0.035 45);
      --red: oklch(54% 0.17 35);
      --red-soft: oklch(93% 0.045 40);
      --line: oklch(90% 0.02 70);
      --white: oklch(99% 0.006 75);
      --wood: oklch(62% 0.11 150);
      --fire: oklch(58% 0.17 25);
      --earth: oklch(66% 0.1 85);
      --metal: oklch(72% 0.01 85);
      --water: oklch(45% 0.08 250);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .screen{width:390px; height:844px; background:var(--bg); overflow:hidden; font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink); display:flex; flex-direction:column;}
    h2{font-family:'Gowun Batang','Noto Serif KR',serif; margin:0; font-weight:700;}
    .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 20px 8px;}
    .content{flex:1; overflow:auto; padding:10px 20px 24px; display:flex; flex-direction:column; gap:18px;}
    .hint{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--red); background:var(--red-soft); padding:7px 12px; border-radius:999px; align-self:flex-start;}
    .ganji-cell{flex:1; text-align:center; padding:14px 4px; border-radius:14px; background:var(--white); border:1.5px solid var(--line); display:flex; flex-direction:column; gap:8px;}
    .glyph{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Gowun Batang',serif; font-size:18px; font-weight:700; margin:0 auto;}
    .cycle-chip{min-width:56px; text-align:center; padding:10px 6px; border-radius:12px; background:var(--white); border:1px solid var(--line); flex-shrink:0;}
  </style>
</helmet>

<div class="screen">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#3a2415" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2 style="font-size:18px;">만세력</h2>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#6b5a45" stroke-width="1.7" fill="none"/><path d="M12 8h.01M11 11h1v6h1" stroke="#6b5a45" stroke-width="1.7" stroke-linecap="round"/></svg>
  </div>

  <div class="content">
    <div class="hint">
      <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19 19l-4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      표를 눌러서 자세히 알아보세요
    </div>

    <div>
      <p style="font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;">사주 원국 · 1996년 3월 14일 오후 3:30</p>
      <div style="display:flex; gap:8px;">
        <div class="ganji-cell"><p style="font-size:11px; color:var(--ink-soft);">년주</p><div class="glyph" style="background:oklch(88% 0.15 25 / .22); color:var(--fire);">丙</div><div class="glyph" style="background:oklch(90% 0.06 250 / .25); color:var(--water);">子</div><p style="font-size:10.5px; color:var(--ink-soft);">병자</p></div>
        <div class="ganji-cell"><p style="font-size:11px; color:var(--ink-soft);">월주</p><div class="glyph" style="background:oklch(88% 0.01 85 / .5); color:#7a7a7a;">辛</div><div class="glyph" style="background:oklch(88% 0.09 150 / .28); color:var(--wood);">卯</div><p style="font-size:10.5px; color:var(--ink-soft);">신묘</p></div>
        <div class="ganji-cell" style="border-color:var(--red); box-shadow:0 0 0 3px var(--red-soft);"><p style="font-size:11px; color:var(--red); font-weight:700;">일주</p><div class="glyph" style="background:oklch(88% 0.09 150 / .28); color:var(--wood);">甲</div><div class="glyph" style="background:oklch(90% 0.06 250 / .25); color:var(--water);">子</div><p style="font-size:10.5px; color:var(--red); font-weight:700;">갑자</p></div>
        <div class="ganji-cell"><p style="font-size:11px; color:var(--ink-soft);">시주</p><div class="glyph" style="background:oklch(88% 0.01 85 / .5); color:#7a7a7a;">庚</div><div class="glyph" style="background:oklch(88% 0.15 25 / .22); color:var(--fire);">午</div><p style="font-size:10.5px; color:var(--ink-soft);">경오</p></div>
      </div>
    </div>

    <div style="display:flex; gap:10px; align-items:center; background:var(--amber-soft); border-radius:16px; padding:12px 14px;">
      <img src="mascot_elements.png" alt="오행" style="width:88px; height:auto; flex-shrink:0;"/>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <span style="font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--wood);display:inline-block;"></span>목 · 성장</span>
        <span style="font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--fire);display:inline-block;"></span>화 · 열정</span>
        <span style="font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--earth);display:inline-block;"></span>토 · 안정</span>
        <span style="font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#9a9a9a;display:inline-block;"></span>금 · 결실</span>
        <span style="font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--water);display:inline-block;"></span>수 · 지혜</span>
      </div>
    </div>

    <div>
      <p style="font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;">대운 (10년 단위)</p>
      <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;">
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">3세</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">壬寅</p></div>
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">13세</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">癸卯</p></div>
        <div class="cycle-chip" style="background:var(--red); border-color:var(--red);"><p style="font-size:11px; color:oklch(88% 0.05 40);">23세</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px; color:var(--white);">甲辰</p></div>
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">33세</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">乙巳</p></div>
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">43세</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">丙午</p></div>
      </div>
    </div>

    <div>
      <p style="font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;">세운 (연 단위)</p>
      <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;">
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">2024</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">甲辰</p></div>
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">2025</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">乙巳</p></div>
        <div class="cycle-chip" style="background:var(--amber-soft); border-color:var(--amber-soft);"><p style="font-size:11px; color:#7a5a1f; font-weight:700;">2026</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">丙午</p></div>
        <div class="cycle-chip"><p style="font-size:11px; color:var(--ink-soft);">2027</p><p style="font-family:'Gowun Batang',serif; font-size:15px; margin-top:4px;">丁未</p></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
