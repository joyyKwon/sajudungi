<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97% 0.02 75);
      --bg-card: oklch(99% 0.012 75);
      --amber-soft: oklch(93% 0.05 82);
      --ink: oklch(28% 0.05 40);
      --ink-soft: oklch(50% 0.035 45);
      --red: oklch(54% 0.17 35);
      --amber-deep: oklch(76% 0.14 68);
      --line: oklch(90% 0.02 70);
      --white: oklch(99% 0.006 75);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .screen{
      width:390px; height:844px; background:var(--bg); overflow:hidden;
      font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);
      display:flex; flex-direction:column;
    }
    h2{font-family:'Gowun Batang','Noto Serif KR',serif; margin:0; font-weight:700;}
    .topbar{display:flex; align-items:center; gap:14px; padding:20px 20px 8px;}
    .field-label{font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:700;}
    .field-box{background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; font-size:15px; display:flex; align-items:center; justify-content:space-between;}
    .seg{display:flex; background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:4px;}
    .seg-item{flex:1; text-align:center; padding:10px; border-radius:10px; font-size:14px; font-weight:700; color:var(--ink-soft);}
    .seg-item.active{background:var(--red); color:var(--white);}
    .btn-primary{background:var(--amber-deep); color:var(--ink); border:none; border-radius:16px; height:56px; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  </style>
</helmet>

<div class="screen">
  <div class="topbar">
    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#3a2415" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 style="font-size:18px;">내 정보 입력</h2>
  </div>

  <div style="display:flex; gap:12px; align-items:center; background:var(--amber-soft); margin:14px 20px; border-radius:16px; padding:14px 16px;">
    <img src="mascot_front.png" alt="사주둥이" style="width:52px; height:auto; flex-shrink:0;"/>
    <p style="font-size:13px; line-height:1.5; color:var(--ink);">생년월일시를 알려주면<br/>정확한 사주를 봐줄게!</p>
  </div>

  <div style="padding:6px 20px 20px; display:flex; flex-direction:column; gap:18px; overflow:auto;">
    <div>
      <div class="field-label">이름 (닉네임)</div>
      <div class="field-box"><span>서연</span></div>
    </div>

    <div>
      <div class="field-label">성별</div>
      <div class="seg">
        <div class="seg-item active">여성</div>
        <div class="seg-item">남성</div>
      </div>
    </div>

    <div>
      <div class="field-label">생년월일</div>
      <div class="seg" style="margin-bottom:8px;">
        <div class="seg-item active">양력</div>
        <div class="seg-item">음력</div>
      </div>
      <div class="field-box">
        <span>1996년 3월 14일</span>
        <svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="#8a8578" stroke-width="1.6"/><path d="M4 9h16M8 3v4M16 3v4" stroke="#8a8578" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div>
      <div class="field-label">태어난 시간</div>
      <div class="field-box">
        <span>오후 3시 30분</span>
        <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#8a8578" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="#8a8578" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <div style="width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line); background:var(--white);"></div>
        <span style="font-size:13px; color:var(--ink-soft);">태어난 시간을 몰라요</span>
      </div>
    </div>
  </div>

  <div style="margin-top:auto; padding:16px 20px 28px;">
    <div class="btn-primary">사주 보러가기</div>
  </div>
</div>
</x-dc>
</body>
</html>
