<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(96% 0.018 80);
      --bg-card: oklch(99% 0.01 80);
      --indigo-soft: oklch(90% 0.03 265);
      --ink: oklch(24% 0.025 265);
      --ink-soft: oklch(48% 0.02 265);
      --indigo: oklch(35% 0.09 265);
      --gold: oklch(74% 0.13 78);
      --gold-deep: oklch(52% 0.12 70);
      --terracotta: oklch(72% 0.09 45);
      --line: oklch(90% 0.015 80);
      --white: oklch(99% 0.005 80);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:var(--indigo);} a:hover{color:var(--gold-deep);}
    .screen{
      width:390px; height:844px; background:var(--bg); position:relative; overflow:hidden;
      font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);
      display:flex; flex-direction:column; padding:64px 28px 28px;
    }
    .deco{position:absolute; border-radius:50%; filter:blur(36px); opacity:.55;}
    h1{font-family:'Gowun Batang','Noto Serif KR',serif; font-weight:700; margin:0;}
    .chip{
      display:inline-flex; align-items:center; padding:8px 14px; border-radius:999px;
      background:var(--white); border:1px solid var(--line); font-size:13px; color:var(--ink-soft);
    }
    .btn{
      display:flex; align-items:center; justify-content:center; gap:10px;
      height:54px; border-radius:16px; font-size:15px; font-weight:700; cursor:default;
    }
    .btn-outline{background:var(--white); color:var(--ink); border:1.5px solid var(--line);}
    .btn-primary{background:var(--gold); color:var(--ink); border:none;}
  </style>
</helmet>

<div class="screen">
  <div class="deco" style="width:320px;height:320px;background:var(--indigo-soft); top:-140px; right:-110px;"></div>
  <div class="deco" style="width:200px;height:200px;background:var(--terracotta); opacity:.18; bottom:180px; left:-80px;"></div>

  <div style="position:relative; display:flex; flex-direction:column; align-items:center; margin-top:24px;">
    <svg width="152" height="152" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="34" rx="34" ry="8" fill="#2b2f52"/>
      <path d="M40 34 Q60 4 80 34 Q60 23 40 34 Z" fill="#363b66"/>
      <circle cx="60" cy="16" r="3.4" fill="#d8a747"/>
      <circle cx="60" cy="68" r="43" fill="#fff8ec" stroke="#2b2f52" stroke-width="3"/>
      <ellipse cx="37" cy="75" rx="7.5" ry="5.2" fill="#e8a583" opacity="0.75"/>
      <ellipse cx="83" cy="75" rx="7.5" ry="5.2" fill="#e8a583" opacity="0.75"/>
      <circle cx="45.5" cy="64" r="4.2" fill="#2b2f52"/>
      <circle cx="74.5" cy="64" r="4.2" fill="#2b2f52"/>
      <circle cx="47" cy="62.3" r="1.3" fill="#fff"/>
      <circle cx="76" cy="62.3" r="1.3" fill="#fff"/>
      <path d="M49 78 Q60 87 71 78" stroke="#2b2f52" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path d="M20 70 Q10 66 14 56" stroke="#2b2f52" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M100 70 Q110 66 106 56" stroke="#2b2f52" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
    <h1 style="font-size:32px; color:var(--indigo); margin-top:18px;">사주둥이</h1>
    <p style="font-size:14.5px; color:var(--ink-soft); margin-top:8px; text-align:center; line-height:1.5;">천년의 지혜, 쉽고 친근하게<br/>사주둥이와 함께 알아가요</p>
    <div style="display:flex; gap:8px; margin-top:22px;">
      <span class="chip">사주풀이</span>
      <span class="chip">만세력</span>
      <span class="chip">사주공부</span>
    </div>
  </div>

  <div style="margin-top:auto; display:flex; flex-direction:column; gap:12px;">
    <div class="btn btn-outline">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3C6.9 3 3 6.4 3 10.6c0 2.7 1.7 5 4.3 6.4l-1 3.7c-.1.4.3.7.6.5l4.3-2.7c.3 0 .5.1.8.1 5.1 0 9-3.4 9-7.6S17.1 3 12 3z" fill="#3c1e1e"/></svg>
      카카오로 시작하기
    </div>
    <div class="btn btn-outline">
      <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#4a4a4a" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="12" font-family="Gowun Dodum, sans-serif" fill="#4a4a4a">G</text></svg>
      Google로 계속하기
    </div>
    <div class="btn btn-outline">
      <svg width="17" height="17" viewBox="0 0 24 24"><path d="M16.5 1.5c.1 1.2-.4 2.4-1.1 3.2-.7.9-1.9 1.6-3 1.5-.1-1.2.4-2.4 1.1-3.2.7-.9 2-1.6 3-1.5zm4.1 16.3c-.4 1-.9 1.9-1.6 2.8-1 1.3-2 2.6-3.5 2.7-1.5 0-1.9-.9-3.6-.9s-2.2.9-3.6.9c-1.5.1-2.6-1.4-3.6-2.7-2-2.8-3.5-8-1.4-11.5.9-1.7 2.6-2.8 4.4-2.8 1.4 0 2.3.9 3.5.9 1.1 0 1.9-.9 3.6-.9 1.5 0 3.1.8 4.1 2.2-3.6 2-3 7.3 1.7 9.3z" fill="#1a1a1a"/></svg>
      Apple로 계속하기
    </div>
    <div style="display:flex; align-items:center; gap:10px; margin:4px 0;">
      <div style="flex:1; height:1px; background:var(--line);"></div>
      <span style="font-size:12px; color:var(--ink-soft);">또는</span>
      <div style="flex:1; height:1px; background:var(--line);"></div>
    </div>
    <div class="btn btn-primary">이메일로 시작하기</div>
    <p style="font-size:11px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.5;">가입 시 이용약관 및 개인정보처리방침에 동의합니다</p>
  </div>
</div>
</x-dc>
</body>
</html>
