name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Saju engine, content, people and legal checks
        run: npm test
      - name: App bundles for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-out
