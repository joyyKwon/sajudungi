name: Public site (GitHub Pages)

# Publishes the legal pages and the account-deletion page. Runs only when something the
# site is built from changes, or when started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - lib/legal.ts
      - scripts/site.ts
      - scripts/build-site.ts
      - scripts/site.config.json
      - scripts/site-assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npx tsx scripts/build-site.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
